<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Quality Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Apply the saved theme (or the system preference) before first paint, so there is no flash. */
(function () {
  var t = null;
  try { t = localStorage.getItem('iaq-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  /* ---------- Theme tokens: dark (default) and day ---------- */
  :root{
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
    color-scheme:dark;
    --bg:#0d1210; --panel:#141b18; --panel-2:#0f1512;
    --line:#24322c; --text:#e7ede9; --text-dim:#8ea198;
    --good:#3ecf8e; --moderate:#e0a83c; --poor:#e0603c;
    --good-bg:rgba(62,207,142,0.14); --moderate-bg:rgba(224,168,60,0.14); --poor-bg:rgba(224,96,60,0.14);
    --poor-border:rgba(224,96,60,0.3);
    --accent:#5fc9a3; --accent-ink:#062017;
    --chart-a:#5fc9a3; --chart-b:#8ea198;
    font-family:var(--sans);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f3f6f4; --panel:#ffffff; --panel-2:#edf2ef;
    --line:#d3ded8; --text:#15201b; --text-dim:#56675f;
    --good:#12774f; --moderate:#94590a; --poor:#b93a0c;
    --good-bg:rgba(18,119,79,0.11); --moderate-bg:rgba(148,89,10,0.12); --poor-bg:rgba(185,58,12,0.11);
    --poor-border:rgba(185,58,12,0.35);
    --accent:#0f7a57; --accent-ink:#ffffff;
    --chart-a:#0f7a57; --chart-b:#7c8b84;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));
    padding-top:calc(28px + env(safe-area-inset-top,0px));
    transition:background-color .25s ease,color .25s ease;
  }
  .wrap{max-width:920px;margin:0 auto}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:18px}
  h1{font-size:1.4rem;font-weight:600;margin:0 0 4px}
  .sub{color:var(--text-dim);font-size:0.88rem;margin:0;max-width:520px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .seg{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;font-family:var(--mono);font-size:0.78rem;transition:background-color .25s ease,border-color .25s ease}
  .seg button{
    background:transparent;border:none;color:var(--text-dim);padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit;
    display:inline-flex;align-items:center;gap:6px;
  }
  .seg button:hover{color:var(--text)}
  .seg button.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .seg button:focus-visible,.pause-btn:focus-visible,.ip-row input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .seg svg{width:14px;height:14px;flex-shrink:0}
  .ip-row{display:flex;align-items:center;gap:6px;color:var(--text-dim)}
  .ip-row input{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:0.78rem;padding:6px 8px;border-radius:6px;width:120px;
  }
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;margin:0 4px 0 6px}
  .conn-dot.live{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
  .conn-dot.err{background:var(--poor);box-shadow:0 0 0 3px var(--poor-bg)}
  .pause-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;
    font-family:var(--mono);font-size:0.78rem;cursor:pointer;
  }
  .pause-btn:hover{border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  @media (max-width:720px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;transition:background-color .25s ease,border-color .25s ease}
  .panel h2{font-size:0.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:500;margin:0 0 14px;display:flex;justify-content:space-between;gap:10px}
  .panel h2 .stamp{font-family:var(--mono);text-transform:none;letter-spacing:0}

  .status-badge{border-radius:11px;padding:20px;text-align:center;margin-bottom:16px;transition:background-color .5s ease,color .5s ease}
  .status-badge .label{font-size:1.7rem;font-weight:600}
  .status-badge .conf{font-family:var(--mono);font-size:0.82rem;opacity:.9;margin-top:4px}
  .status-good{background:var(--good-bg);color:var(--good)}
  .status-moderate{background:var(--moderate-bg);color:var(--moderate)}
  .status-poor{background:var(--poor-bg);color:var(--poor)}

  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:10px;font-size:0.78rem}
  .bar-track{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:block}
  .bar-fill.good{background:var(--good)} .bar-fill.moderate{background:var(--moderate)} .bar-fill.poor{background:var(--poor)}
  .bar-val{font-family:var(--mono);text-align:right;color:var(--text-dim)}

  .readouts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .readout{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:background-color .25s ease,border-color .25s ease}
  .readout .k{font-size:0.72rem;color:var(--text-dim)}
  .readout .v{font-family:var(--mono);font-size:1.25rem;margin-top:2px}
  .readout .v span{font-size:0.7rem;color:var(--text-dim);margin-left:2px}

  .ref-panel{grid-column:1 / -1}
  .ref-row{display:flex;flex-wrap:wrap;gap:12px}
  .ref-row .readout{flex:1 1 150px}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:0.82rem;font-family:var(--sans);font-weight:600}
  .chip.good{background:var(--good-bg);color:var(--good)}
  .chip.moderate{background:var(--moderate-bg);color:var(--moderate)}
  .chip.poor{background:var(--poor-bg);color:var(--poor)}
  .match-ok{color:var(--good)} .match-bad{color:var(--poor)}
  .readout .v .session{font-family:var(--sans);font-size:0.72rem;color:var(--text-dim);margin-top:3px}

  .chart-panel{grid-column:1 / -1}
  svg.chart{width:100%;height:150px;display:block}
  svg.chart .line-a{stroke:var(--chart-a)} svg.chart .line-b{stroke:var(--chart-b)}
  svg.chart path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
  .chart-legend{display:flex;gap:18px;font-size:0.74rem;color:var(--text-dim);margin-top:10px;font-family:var(--mono);flex-wrap:wrap}
  .chart-legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block}
  .swatch.a{background:var(--chart-a)} .swatch.b{background:var(--chart-b)}

  footer{margin-top:20px;color:var(--text-dim);font-size:0.76rem;line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
  footer p{margin:0 0 8px}
  footer code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-family:var(--mono)}
  .err-banner{display:none;background:var(--poor-bg);color:var(--poor);border:1px solid var(--poor-border);border-radius:10px;padding:10px 14px;font-size:0.8rem;margin-bottom:16px}

  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Indoor Air Quality Console</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Data source">
        <span class="conn-dot" id="connDot"></span>
        <button id="btnReplay" class="active" aria-pressed="true">Replay</button>
        <button id="btnLive" aria-pressed="false">ESP32</button>
        <div class="ip-row" id="ipRow" style="display:none">
          <span>http://</span><input id="espIp" value="192.168.4.1" spellcheck="false" aria-label="ESP32 IP address">
        </div>
      </div>
      <button class="pause-btn" id="btnPause" type="button">Pause</button>
      <div class="seg" role="group" aria-label="Colour theme">
        <button id="themeDay" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Day
        </button>
        <button id="themeDark" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark
        </button>
      </div>
    </div>
  </header>

  <div class="err-banner" id="errBanner"></div>

  <div class="grid">
    <div class="panel">
      <h2>Prediction</h2>
      <div class="status-badge status-good" id="statusBadge">
        <div class="label" id="statusLabel">&mdash;</div>
        <div class="conf" id="statusConf">&mdash;</div>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="panel">
      <h2>Sensor readings <span class="stamp" id="stamp"></span></h2>
      <div class="readouts" id="readouts"></div>
    </div>

    <div class="panel ref-panel" id="refPanel">
      <h2>Reference analyzer &mdash; ground truth for this hour</h2>
      <div class="ref-row">
        <div class="readout"><div class="k">CO</div><div class="v" id="refCo">&mdash;<span>mg/m&sup3;</span></div></div>
        <div class="readout"><div class="k">Reference class</div><div class="v" id="refClass">&mdash;</div></div>
        <div class="readout"><div class="k">Model vs reference</div><div class="v" id="refMatch">&mdash;</div></div>
      </div>
    </div>

    <div class="panel chart-panel">
      <h2>Last 60 readings</h2>
      <svg class="chart" id="chart" viewBox="0 0 880 150" preserveAspectRatio="none" role="img" aria-label="Recent sensor trend"></svg>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

}
applyTheme(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

/* ---------------- Model: trained weights, forward pass ---------------- */
function dense(x, W, b){
  // x: [in], W: [in][out], b: [out]
  const out = new Array(b.length);
  for (let j = 0; j < b.length; j++){
    let acc = b[j];
    for (let i = 0; i < x.length; i++) acc += x[i] * W[i][j];
    out[j] = acc;
  }
  return out;
}
function softmax(logits){
  const m = Math.max(...logits);
  const exps = logits.map(v => Math.exp(v - m));
  const sum = exps.reduce((a, b) => a + b, 0);
  return exps.map(v => v / sum);
}
function predictRaw(raw){
  // normalize -> [Dense + ReLU] x hidden -> Dense -> softmax
  let h = raw.map((v, i) => (v - MODEL.mean[i]) / MODEL.std[i]);
  MODEL.layers.forEach((L, li) => {
    h = dense(h, L.W, L.b);
    if (li < MODEL.layers.length - 1) h = h.map(v => v > 0 ? v : 0);
  });
  const probs = softmax(h);
  let best = 0;
  for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
  return { classIndex: best, probs };
}

const CLASS_NAMES = ["Good", "Moderate", "Poor"];
const CLASS_KEY = ["good", "moderate", "poor"];

/* ---------------- State ---------------- */
let mode = "replay";       // "replay" | "live"
let paused = false;
let replayIdx = 0;
let prevStamp = null;
let history = [];          // { a, b } scaled 0..1
const MAX_POINTS = 60;
const session = { seen: 0, correct: 0 };

const CHARTS = {
  replay: { a: { name: "CO sensor S1 (scaled)", lo: 600, hi: 2100 }, b: { name: "NMHC sensor S2 (scaled)", lo: 450, hi: 1700 } },
  live:   { a: { name: "Temperature (scaled)", lo: 10, hi: 40 },     b: { name: "Gas (scaled)", lo: 0, hi: 4095 } },
};

const $ = id => document.getElementById(id);
const els = {
  subtitle: $('subtitle'), btnReplay: $('btnReplay'), btnLive: $('btnLive'), btnPause: $('btnPause'),
  ipRow: $('ipRow'), espIp: $('espIp'), connDot: $('connDot'), errBanner: $('errBanner'),
  statusBadge: $('statusBadge'), statusLabel: $('statusLabel'), statusConf: $('statusConf'), bars: $('bars'),
  readouts: $('readouts'), stamp: $('stamp'), refPanel: $('refPanel'),
  refCo: $('refCo'), refClass: $('refClass'), refMatch: $('refMatch'),
  chart: $('chart'), chartLegend: $('chartLegend'), foot: $('foot'),
};

els.btnReplay.addEventListener('click', () => { setMode('replay'); tick(); });
els.btnLive.addEventListener('click', () => { setMode('live'); tick(); });
els.btnPause.addEventListener('click', () => {
  paused = !paused;
  els.btnPause.textContent = paused ? 'Resume' : 'Pause';
});

function setMode(m){
  mode = m;
  els.btnReplay.classList.toggle('active', m === 'replay');
  els.btnLive.classList.toggle('active', m === 'live');
  els.btnReplay.setAttribute('aria-pressed', m === 'replay');
  els.btnLive.setAttribute('aria-pressed', m === 'live');
  els.ipRow.style.display = m === 'live' ? 'flex' : 'none';
  els.btnPause.style.display = m === 'replay' ? '' : 'none';
  els.refPanel.style.display = m === 'replay' ? '' : 'none';
  els.errBanner.style.display = 'none';
  els.subtitle.textContent = m === 'replay'
    ? 'Real hourly readings from the UCI Air Quality dataset, replayed and classified by the trained neural network running in this tab'
    : 'Polling a live ESP32 over the local network';
  els.connDot.className = 'conn-dot';
  els.stamp.textContent = '';
  history = [];
  prevStamp = null;
  renderChartLegend();
  renderChart();
  renderFooter();
}

/* ---------------- Rendering ---------------- */
function renderBadge(prediction){
  const key = CLASS_KEY[prediction.classIndex];
  els.statusBadge.className = 'status-badge status-' + key;
  els.statusLabel.textContent = CLASS_NAMES[prediction.classIndex];
  els.statusConf.textContent = (prediction.probs[prediction.classIndex] * 100).toFixed(0) + '% confidence';

  els.bars.innerHTML = '';
  CLASS_NAMES.forEach((name, i) => {
    const pct = (prediction.probs[i] * 100).toFixed(1);
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `<span>${name}</span>
      <span class="bar-track"><span class="bar-fill ${CLASS_KEY[i]}" style="width:${pct}%"></span></span>
      <span class="bar-val">${pct}%</span>`;
    els.bars.appendChild(row);
  });
}

function renderReadouts(items){
  els.readouts.innerHTML = items.map(it =>
    `<div class="readout"><div class="k">${it.k}</div><div class="v">${it.v}<span>${it.unit}</span>${it.note || ''}</div></div>`
  ).join('');
}

function renderChartLegend(){
  const c = CHARTS[mode];
  els.chartLegend.innerHTML =
    `<span><span class="swatch a"></span> ${c.a.name}</span><span><span class="swatch b"></span> ${c.b.name}</span>`;
}

function renderChart(){
  const w = 880, h = 150, pad = 6, n = history.length;
  if (n < 2){ els.chart.innerHTML = ''; return; }
  function pathFor(key){
    return history.map((p, i) => {
      const x = pad + (i / (MAX_POINTS - 1)) * (w - pad * 2);
      const y = h - pad - Math.min(1, Math.max(0, p[key])) * (h - pad * 2);
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }
  els.chart.innerHTML = `<path class="line-a" d="${pathFor('a')}"/><path class="line-b" d="${pathFor('b')}"/>`;
}

function pushHistory(rawA, rawB){
  const c = CHARTS[mode];
  history.push({ a: (rawA - c.a.lo) / (c.a.hi - c.a.lo), b: (rawB - c.b.lo) / (c.b.hi - c.b.lo) });
  if (history.length > MAX_POINTS) history.shift();
}

function renderFooter(){
  const acc = META.testAccuracy != null ? (META.testAccuracy * 100).toFixed(1) + '%' : 'n/a';
  const f1 = META.testF1 != null ? META.testF1.toFixed(2) : 'n/a';
  els.foot.innerHTML = mode === 'replay'
    ? `<p>Prediction runs client-side, using the weights trained by <code>train_model_uci.py</code>. The replayed hours come from
       calendar weeks that were <strong>held out</strong> &mdash; never used for training or tuning &mdash; and are compared with the
       reference analyzer's readings (CPCB India AQI breakpoints, worst pollutant wins). On the full held-out set the model scores
       <strong>${acc}</strong> accuracy (macro-F1 ${f1}).</p>
       <p>The inputs are the UCI dataset's own sensor array (T, RH and four metal-oxide sensors; no CO&#8322; or NO&#8322; sensor), not a DHT22 + MQ-135, so this model is a
       real-data benchmark rather than the model flashed on the ESP32.</p>`
    : `<p>Polling <code>/api/data</code> on the device. In this mode the page shows the ESP32's own prediction from whichever model is flashed on it
       (the DHT22 / MQ-135 firmware in <code>esp32_firmware/</code>).</p>`;
}

/* ---------------- Replay tick ---------------- */
function tickReplay(){
  if (paused || !REPLAY.length || !MODEL) return;
  const row = REPLAY[replayIdx];
  replayIdx = (replayIdx + 1) % REPLAY.length;
  // row: [timestamp, T, RH, S1, S2, S3, S5, CO(GT), label]
  const [ts, T, RH, s1, s2, s3, s5, co, label] = row;

  // start a fresh trace when the replay jumps to a different held-out week
  const t = new Date(ts.replace(' ', 'T')).getTime();
  if (prevStamp !== null && Math.abs(t - prevStamp) > 3600 * 1000 * 1.5) history = [];
  prevStamp = t;

  const prediction = predictRaw([T, RH, s1, s2, s3, s5]);
  session.seen++;
  if (prediction.classIndex === label) session.correct++;

  pushHistory(s1, s2);
  els.stamp.textContent = ts;
  renderReadouts([
    { k: 'Temperature', v: T.toFixed(1), unit: '&deg;C' },
    { k: 'Humidity', v: RH.toFixed(1), unit: '%' },
    { k: 'CO sensor (S1)', v: Math.round(s1), unit: 'raw' },
    { k: 'NMHC sensor (S2)', v: Math.round(s2), unit: 'raw' },
    { k: 'NO<sub>x</sub> sensor (S3)', v: Math.round(s3), unit: 'raw' },
    { k: 'O<sub>3</sub> sensor (S5)', v: Math.round(s5), unit: 'raw' },
  ]);
  renderBadge(prediction);
  renderChart();

  els.refCo.innerHTML = co.toFixed(1) + '<span>mg/m&sup3;</span>';
  els.refClass.innerHTML = `<span class="chip ${CLASS_KEY[label]}">${CLASS_NAMES[label]}</span>`;
  const ok = prediction.classIndex === label;
  els.refMatch.innerHTML = `<span class="${ok ? 'match-ok' : 'match-bad'}">${ok ? '&#10003; match' : '&#10007; miss'}</span>` +
    `<div class="session">${session.correct}/${session.seen} correct this session</div>`;
  els.connDot.className = 'conn-dot live';
}

/* ---------------- Live ESP32 tick ---------------- */
async function tickLive(){
  const ip = els.espIp.value.trim() || '192.168.4.1';
  try {
    const res = await fetch(`http://${ip}/api/data`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    pushHistory(d.temperature, d.gas);
    renderReadouts([
      { k: 'Temperature', v: d.temperature.toFixed(1), unit: '&deg;C' },
      { k: 'Humidity', v: d.humidity.toFixed(1), unit: '%' },
      { k: 'Gas (ADC)', v: Math.round(d.gas), unit: 'raw' },
    ]);
    // Use the ESP32's own prediction (it already ran the firmware model)
    const classIndex = CLASS_NAMES.indexOf(d.prediction);
    renderBadge({ classIndex: classIndex >= 0 ? classIndex : 0, probs: d.probs });
    renderChart();
    els.connDot.className = 'conn-dot live';
    els.errBanner.style.display = 'none';
  } catch (err) {
    els.connDot.className = 'conn-dot err';
    els.errBanner.style.display = 'block';
    els.errBanner.textContent = `Can't reach ${ip}/api/data \u2014 check the board is powered, flashed, ` +
      `and that this computer is joined to its Wi-Fi network (or that CORS/network routing allows it). (${err.message})`;
  }
}

function tick(){ return mode === 'replay' ? tickReplay() : tickLive(); }

setMode('replay');
tick();
setInterval(tick, 2500);
</script>
</body>
</html>
